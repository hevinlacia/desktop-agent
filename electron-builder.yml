appId: dev.hevin.desktop-agent
productName: Desktop Agent
copyright: MIT

directories:
  buildResources: build
  output: release

files:
  - out/**
  - resources/**
  - package.json

# pi SDK 带有 WASM 与资源文件，不打包进 asar，按目录原样分发最稳。
asar: false
# 没有原生模块，跳过 node-gyp 重建。
npmRebuild: false

linux:
  icon: resources/icon.png
  executableName: desktop-agent
  category: Development
  # 产物文件名不带空格：desktop-agent-0.2.0-x64.AppImage / .deb / .pacman（默认用 productName，带空格）。
  # pacman 包会被 justfile 改名成 pacman -U 认的 .pkg.tar.xz。
  artifactName: ${name}-${version}-${arch}.${ext}
  # 能打的目标都列在这里。`just package` 默认只打 pacman（目前只在 Arch 系上使用），
  # 要别的就在后面点名：just package appimage deb。
  # 生成的 desktop 文件名是 desktop-agent.desktop，须与 package.json 的 desktopName 一致：
  # Wayland 下 portal 全局快捷键靠它识别应用身份。AppImage 不带桌面身份。
  target:
    - pacman
    - AppImage
    - deb

# 以下平台的配置写了但没验证过。
mac:
  icon: resources/icon.png
  category: public.app-category.developer-tools
  target:
    - dmg

win:
  icon: resources/icon.png
  target:
    - nsis
